<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login Form</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            font-family: "Times New Roman", serif;
        }

        .container {
            width: 100%;
            text-align: center;
            margin-top: 105px;
            
        }

        .logo {
            width: 150px;
            height: auto;
            margin-bottom: 45px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 25px;
            text-align: center;
        }

        .login-form {
            width: 420px;
            margin: auto;
            text-align: left;
        }

        .form-row {
            margin-bottom: 15px;
        }

        label {
            display: inline-block;
            width: 85px;
            font-size: 18px;
        }

        input[type="email"],
        input[type="password"] {
            width: 165px;
            height: 22px;
            padding: 2px 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        input::placeholder {
            color: #999;
        }

        .buttons {
            margin-left: 85px;
            margin-top: 10px;
        }

        button {
            padding: 3px 10px;
            margin-right: 5px;
            font-family: "Times New Roman", serif;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- SMIT Logo -->
        <img src="smit-logo.jpeg" alt="SMIT Logo" class="logo">

        <h2>STUDENT LOGIN FORM</h2>

        <form class="login-form">

            <div class="form-row">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="Enter Email"
                    required
                >
            </div>

            <div class="form-row">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="Enter Password"
                    required
                >
            </div>

            <div class="buttons">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>

        </form>

    </div>

</body>
</html>
